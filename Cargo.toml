[workspace]
members = ["mods/template", "mods/template/pack"]
default-members = ["mods/template"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
mod-api = { git = "https://github.com/cinnabar-mc/cinnabar", rev = "17d5edab7cf61546e744415c5ac6620b6b3245fb" }

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
